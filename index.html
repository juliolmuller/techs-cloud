<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Stack Cloud</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-top: 40px;
            margin-bottom: 20px;
            font-weight: 600;
            z-index: 10;
        }

        /* The Cloud Container */
        #cloud-container {
            width: 100vw;
            height: 50vh;
            position: relative;
            overflow: hidden;
            /* Fades out the edges slightly */
            mask-image: radial-gradient(ellipse at center, black 50%, transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 50%, transparent 100%);
        }

        /* Positions the item in the grid */
        .cloud-anchor {
            position: absolute;
            /* Center the anchor point */
            transform: translate(-50%, -50%);
        }

        /* Handles the floating animation and scaling */
        .cloud-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* Variables injected via JS */
            transform: scale(var(--scale));
            animation: float var(--duration) ease-in-out infinite alternate var(--delay);
            will-change: transform;
        }

        .icon {
            width: 48px;
            height: 48px;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        .invert-dark {
            filter: invert(1) brightness(2) drop-shadow(0 4px 6px rgba(255,255,255,0.1));
        }

        .name {
            font-size: 0.75rem;
            margin-top: 6px;
            font-weight: 500;
            opacity: 0.8;
            white-space: nowrap;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* Random Floating Keyframes */
        @keyframes float {
            0% {
                transform: scale(var(--scale)) translate(0, 0);
            }
            100% {
                transform: scale(var(--scale)) translate(var(--tx), var(--ty));
            }
        }
    </style>
</head>
<body>

    <h1>My Tech Stack</h1>
    <div id="cloud-container"></div>

    <script>
        const getDevicon = (id, version = 'original') =>
            `https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/${id}/${id}-${version}.svg`;
        const getSvgl = (id) =>
            `https://raw.githubusercontent.com/pheralb/svgl/refs/heads/main/static/library/${id}.svg`;
        const getSimpleIcon = (id) =>
            `https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/${id}.svg`;

        const techs = [
            { name: 'AWS', url: getDevicon('amazonwebservices', 'original-wordmark') },
            { name: 'Android', url: getDevicon('android') },
            { name: 'AngularJS', url: getDevicon('angularjs') },
            { name: 'Apache', url: getDevicon('apache') },
            { name: 'Kafka', url: getDevicon('apachekafka', 'plain'), invert: true },
            { name: 'GraphQL', url: getDevicon('graphql', 'plain') },
            { name: 'ArgoCD', url: getDevicon('argocd') },
            { name: 'Axios', url: getDevicon('axios', 'plain'), invert: true },
            { name: 'Babel', url: getDevicon('babel') },
            { name: 'Bash', url: getDevicon('bash', 'plain'), invert: true },
            { name: 'Bootstrap', url: getDevicon('bootstrap') },
            { name: 'Bun', url: getDevicon('bun') },
            { name: 'C', url: getDevicon('c') },
            { name: 'CircleCI', url: getDevicon('circleci', 'plain'), invert: true },
            { name: 'Composer', url: getDevicon('composer') },
            { name: 'CSS3', url: getDevicon('css3') },
            { name: 'Cypress', url: getDevicon('cypressio') },
            { name: 'Docker', url: getDevicon('docker') },
            { name: 'DynamoDB', url: getDevicon('dynamodb') },
            { name: 'Electron', url: getDevicon('electron') },
            { name: 'Elasticsearch', url: getDevicon('elasticsearch') },
            { name: 'ESLint', url: getDevicon('eslint') },
            { name: 'Express', url: getDevicon('express', 'original'), invert: true },
            { name: 'Fastify', url: getDevicon('fastify', 'plain'), invert: true },
            { name: 'FeathersJS', url: getDevicon('feathersjs', 'plain'), invert: true },
            { name: 'Figma', url: getDevicon('figma') },
            { name: 'Firebase', url: getDevicon('firebase') },
            { name: 'Git', url: getDevicon('git') },
            { name: 'GitHub', url: getDevicon('github'), invert: true },
            { name: 'GitHub Actions', url: getDevicon('githubactions') },
            { name: 'GitLab', url: getDevicon('gitlab') },
            { name: 'Go', url: getDevicon('go', 'original-wordmark') },
            { name: 'Google Cloud', url: getDevicon('googlecloud') },
            { name: 'gRPC', url: getDevicon('grpc', 'plain'), invert: true },
            { name: 'HTML5', url: getDevicon('html5') },
            { name: 'Java', url: getDevicon('java') },
            { name: 'JavaScript', url: getDevicon('javascript') },
            { name: 'Jest', url: getDevicon('jest', 'plain') },
            { name: 'Jira', url: getDevicon('jira') },
            { name: 'jQuery', url: getDevicon('jquery') },
            { name: 'Kotlin', url: getDevicon('kotlin') },
            { name: 'Kubernetes', url: getDevicon('kubernetes', 'plain') },
            { name: 'Laravel', url: getDevicon('laravel', 'original') },
            { name: 'Linux', url: getDevicon('linux') },
            { name: 'Lua', url: getDevicon('lua', 'plain'), invert: true },
            { name: 'Material UI', url: getDevicon('materialui') },
            { name: 'MongoDB', url: getDevicon('mongodb') },
            { name: 'MySQL', url: getDevicon('mysql') },
            { name: 'NestJS', url: getDevicon('nestjs', 'original') },
            { name: 'Next.js', url: getDevicon('nextjs', 'plain'), invert: true },
            { name: 'Node.js', url: getDevicon('nodejs') },
            { name: 'SQL', url: getDevicon('sqldeveloper') },
            { name: 'Nuxt', url: getDevicon('nuxtjs') },
            { name: 'Okta', url: getDevicon('okta', 'plain'), invert: true },
            { name: 'PostgreSQL', url: getDevicon('postgresql') },
            { name: 'Postman', url: getDevicon('postman') },
            { name: 'Prisma', url: getDevicon('prisma', 'original'), invert: true },
            { name: 'PHP', url: getDevicon('php') },
            { name: 'Python', url: getDevicon('python') },
            { name: 'React', url: getDevicon('react') },
            { name: 'React Native', url: getDevicon('react') },
            { name: 'Redux', url: getDevicon('redux') },
            { name: 'Ruby', url: getDevicon('ruby', 'plain') },
            { name: 'Sass', url: getDevicon('sass') },
            { name: 'Sanity', url: getDevicon('sanity', 'plain') },
            { name: 'Socket.io', url: getDevicon('socketio'), invert: true },
            { name: 'Spring', url: getDevicon('spring') },
            { name: 'Swagger', url: getDevicon('swagger') },
            { name: 'Tailwind CSS', url: getDevicon('tailwindcss', 'original') },
            { name: 'Terraform', url: getDevicon('terraform', 'plain'), invert: true },
            { name: 'TypeScript', url: getDevicon('typescript') },
            { name: 'Vercel', url: getDevicon('vercel', 'plain'), invert: true },
            { name: 'Vite', url: getDevicon('vitejs') },
            { name: 'VS Code', url: getDevicon('vscode') },
            { name: 'Vue.js', url: getDevicon('vuejs') },
            { name: 'npm', url: getDevicon('npm', 'original-wordmark') },
            { name: 'Datadog', url: getSvgl('datadog'), fallback: getSimpleIcon('datadog') },
            { name: 'Expo', url: getSvgl('expo'), fallback: getSimpleIcon('expo'), invert: true },
            { name: 'Mapbox', url: getSvgl('mapbox'), fallback: getSimpleIcon('mapbox'), invert: true },
            { name: 'Claude', url: getSvgl('claude'), fallback: getSimpleIcon('anthropic') },
            { name: 'Lovable', url: getSvgl('lovable'), fallback: getSimpleIcon('lovable') },
            { name: 'Cursor', url: getSvgl('cursor'), fallback: getSimpleIcon('cursor'), invert: true },
            { name: 'Gemini', url: getSvgl('gemini'), fallback: getSimpleIcon('googlegemini') },
            { name: 'GPT', url: getSvgl('openai'), fallback: getSimpleIcon('openai'), invert: true },
            { name: 'Stripe', url: getSvgl('stripe'), fallback: getSimpleIcon('stripe') }
        ];

        const container = document.getElementById('cloud-container');

        function renderCloud() {
            container.innerHTML = '';

            const W = container.clientWidth;
            const H = container.clientHeight;
            const N = techs.length;

            // Jittered Grid Distribution
            // Calculate optimal rows and columns to fit all items proportionally based on aspect ratio
            const aspectRatio = W / H;
            const R = Math.ceil(Math.sqrt(N / aspectRatio));
            const C = Math.ceil(N / R);

            // Generate grid cells
            let cells = [];
            for (let r = 0; r < R; r++) {
                for (let c = 0; c < C; c++) {
                    cells.push({ r, c });
                }
            }

            // Shuffle cells randomly
            cells.sort(() => Math.random() - 0.5);

            techs.forEach((tech, i) => {
                const cell = cells[i];

                // Base cell dimensions
                const cellW = W / C;
                const cellH = H / R;

                // Add random offset within the cell (jitter) to make it organic but evenly spaced
                const randomX = (Math.random() - 0.5) * (cellW * 0.7);
                const randomY = (Math.random() - 0.5) * (cellH * 0.7);

                // Calculate final absolute position
                const x = (cell.c + 0.5) * cellW + randomX;
                const y = (cell.r + 0.5) * cellH + randomY;

                // Create the wrapper anchor that places it in the grid
                const anchor = document.createElement('div');
                anchor.className = 'cloud-anchor';
                anchor.style.left = `${x}px`;
                anchor.style.top = `${y}px`;

                // Calculate random depth (z-index) and scale (visual size)
                const depthScale = Math.random() * 0.8 + 0.6; // Scale between 0.6 and 1.4
                anchor.style.zIndex = Math.round(depthScale * 100);

                // Create the animated item
                const item = document.createElement('div');
                item.className = 'cloud-item';

                // Inject random animation variables
                item.style.setProperty('--scale', depthScale);
                item.style.setProperty('--duration', `${3 + Math.random() * 4}s`); // 3s to 7s
                item.style.setProperty('--delay', `-${Math.random() * 5}s`); // Desync starts
                item.style.setProperty('--tx', `${(Math.random() - 0.5) * 30}px`); // Drift X
                item.style.setProperty('--ty', `${(Math.random() - 0.5) * 30}px`); // Drift Y

                // Build Image
                const img = document.createElement('img');
                img.src = tech.url;
                img.alt = tech.name;
                img.className = `icon ${tech.invert ? 'invert-dark' : ''}`;

                img.onerror = function() {
                    if (tech.fallback && this.src !== tech.fallback) {
                        this.src = tech.fallback;
                        this.classList.add('invert-dark');
                    } else {
                        anchor.style.display = 'none';
                    }
                };

                // Build Text Label
                const name = document.createElement('span');
                name.className = 'name';
                name.textContent = tech.name;

                item.appendChild(img);
                item.appendChild(name);
                anchor.appendChild(item);
                container.appendChild(anchor);
            });
        }

        // Initial render
        renderCloud();

        // Recalculate positions if the window is resized
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(renderCloud, 200);
        });
    </script>
</body>
</html>
